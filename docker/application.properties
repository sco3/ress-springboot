server.port=8009
server.address=0.0.0.0

# SSL
server.ssl.key-store=file:/app/server-keystore.jks
server.ssl.key-store-password=server
server.ssl.key-password=server

# Actuator
endpoints.shutdown.enabled=true
endpoints.health.sensitive=false

# Jersey servlet path
# Registered via ServletRegistrationBean in Application.java

# webserver
webserver.port=8009
webserver.https.port=8010
webserver.keystore.file=server-keystore.jks
webserver.keystore.password=server
webserver.key.password=server
webserver.host=0.0.0.0
webserver.thread.pool.size=-1

token.minutes.to.live=480
auth.method=HmacSHA512
auth.secret=asdfasdfasdfasdfasdfasdfa
search.time.filter=true
rest.user.stat=false
cassandra.net.compress=false
find.consistency.level=QUORUM

# cassandra
cassandra.hosts.comma.separated=cassandra
cassandra.port=9042
cassandra.keyspace=tnf
cassandra.user=cassandra
cassandra.password=cassandra
db.user=cassandra
db.password=cassandra
db.cassandra.create.keyspace.cql=CREATE KEYSPACE if not exists tnf WITH replication = {'class': 'SimpleStrategy', 'replication_factor': '1'} AND durable_writes = true;
