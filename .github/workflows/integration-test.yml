name: Integration Tests

on:
  push:
    branches: [main, development, feature-*, bugfix-*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven project
        run: mvn clean package -DskipTests -q

      - name: Build Docker image
        run: docker build -t ress-srv:latest .

      - name: Start docker-compose stack
        run: |
          docker-compose up -d
          echo "Waiting for Cassandra..."
          for i in $(seq 1 40); do
            if docker-compose exec -T cassandra cqlsh -e "describe cluster" >/dev/null 2>&1; then
              echo "Cassandra is ready"
              break
            fi
            sleep 3
          done
          echo "Waiting for init scripts to complete..."
          sleep 20

      - name: Run integration tests (Maven)
        run: mvn verify -Pintegration-test -pl ress-srv

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Cassandra logs ==="
          docker-compose logs cassandra | tail -100
          echo "=== Webserver logs ==="
          docker-compose logs webserver | tail -100

      - name: Tear down
        if: always()
        run: docker-compose down -v --remove-orphans
